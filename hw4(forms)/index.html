<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework4</title>
</head>
<body>
    <!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form class="form">
      <fieldset class="group-1">
        <h3 class="h3">Ваши личные данные</h3>
        <label class="label" for="name">
          <span class="name-input">Ваше имя</span>
          <input class="input-style" id="name" type="text" placeholder="Имя" />
        </label>
        <label class="label" for="age">
          <span class="name-input">Ваш возраст</span>
          <input
            class="input-style"
            id="age"
            type="number"
            inputmode="numeric"
            placeholder="Возраст"
          />
        </label>
        <label class="label" for="tel">
          <span class="name-input">Ваш номер телефона</span>
          <input
            class="input-style"
            id="tel"
            type="tel"
            inputmode="tel"
            placeholder="Номер телефона"
          />
        </label>
        <label class="label" for="mail">
          <span class="name-input">Ваша почта</span>
          <input
            class="input-style"
            id="mail"
            type="email"
            placeholder="Почта"
            inputmode="email"
          />
        </label>
        <label class="label" for="other">
          <span class="name-input">Cообщение</span>
          <textarea
            class="input-style textarea"
            name="textarea"
            id="other"
            placeholder="Ваше сообщение"
          ></textarea>
        </label>
        <label class="label" for="checkbox">
          <input class="checkbox" type="checkbox" name="true" value="true" />
          Я принимаю правила
        </label>
      </fieldset>
      <button class="button" type="submit">Отправить</button>
    </form>
  </body>
</html>
